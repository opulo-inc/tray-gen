<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumenPnP IC Tray Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ea; --panel:#ffffff; --border:#e4ded2; --accent:#daa520;
    --text:#22262c; --dim:#7a7568; --red:#c0392b; --pw:340px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 "Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { display:grid; grid-template-columns:var(--pw) 6px 1fr; grid-template-rows:100vh; }
  aside { overflow-y:auto; padding:18px 18px 28px; background:var(--panel); border-right:1px solid var(--border); }
  #divider { cursor:col-resize; background:transparent; position:relative; }
  #divider::after { content:""; position:absolute; inset:0 2px; background:var(--border); border-radius:2px; transition:background .15s; }
  #divider:hover::after, #divider.dragging::after { background:var(--accent); }
  main { position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  h1 { font-size:17px; font-weight:700; margin:0 0 2px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .sec { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--dim); margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
  .sec::after { content:""; flex:1; height:1px; background:var(--border); }
  label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  select,input[type=number] { width:100%; background:#fbfaf7; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:13px; font-family:inherit; }
  select:focus,input:focus { outline:none; border-color:var(--accent); }
  input[type=range] { width:100%; accent-color:var(--accent); margin-top:6px; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text); }
  .check input { accent-color:var(--accent); width:15px; height:15px; }
  button { width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1px solid var(--border); background:#fbfaf7; color:var(--text); font-size:13px; font-family:inherit; font-weight:500; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#2a2110; border-color:transparent; font-weight:700; }
  button.primary:hover:not(:disabled) { filter:brightness(1.07); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .hint { font-size:11px; color:var(--dim); margin-top:6px; }
  #hud { position:absolute; left:14px; bottom:12px; font-size:12px; color:#6e6a5e; pointer-events:none; }
  #logo { position:absolute; top:14px; right:16px; width:118px; opacity:.85; pointer-events:none; user-select:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:13px; background:var(--bg); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "manifold": "./vendor/manifold.js"
} }
</script>
</head>
<body>
<aside>
  <h1>LumenPnP Tray Generator</h1>
  <div class="sub">175 x 120 mm tray for the staging plate.</div>

  <div class="sec">Mounting holes</div>
  <label for="screw">Screw size</label>
  <select id="screw">
    <option value="M4">M4 socket head</option>
    <option value="M3">M3 socket head</option>
  </select>

  <div class="sec">Package</div>
  <label for="pkg">Part A</label>
  <select id="pkg"></select>
  <div class="row">
    <div><label for="px">X (mm)</label><input id="px" type="number" step="0.01" min="0.1" max="160"></div>
    <div><label for="py">Y (mm)</label><input id="py" type="number" step="0.01" min="0.1" max="110"></div>
    <div><label for="pz">Z (mm)</label><input id="pz" type="number" step="0.01" min="0.1" max="8.5"></div>
  </div>
  <div class="row">
    <div><label for="clearance">Clearance (mm)</label><input id="clearance" type="number" step="0.05" min="0" max="1.5"></div>
    <div><label for="cols">Max cols</label><input id="cols" type="number" step="1" min="1" placeholder="auto"></div>
    <div><label for="rows">Max rows</label><input id="rows" type="number" step="1" min="1" placeholder="auto"></div>
  </div>
  <div class="hint">X/Y: overall outline incl. leads. Z: seating plane to top (datasheet "A").</div>
  <label class="check"><input type="checkbox" id="twoParts"> Two package types</label>

  <div id="partBWrap" hidden>
    <div class="sec">Second package</div>
    <label for="pkgB">Part B</label>
    <select id="pkgB"></select>
    <div class="row">
      <div><label for="pxB">X (mm)</label><input id="pxB" type="number" step="0.01" min="0.1" max="160"></div>
      <div><label for="pyB">Y (mm)</label><input id="pyB" type="number" step="0.01" min="0.1" max="110"></div>
      <div><label for="pzB">Z (mm)</label><input id="pzB" type="number" step="0.01" min="0.1" max="8.5"></div>
    </div>
    <div class="row2">
      <div><label for="colsB">Max cols</label><input id="colsB" type="number" step="1" min="1" placeholder="auto"></div>
      <div><label for="rowsB">Max rows</label><input id="rowsB" type="number" step="1" min="1" placeholder="auto"></div>
    </div>

    <div class="sec">Space split</div>
    <label for="split"><span id="splitLabel">A 50% / B 50%</span></label>
    <input id="split" type="range" min="15" max="85" step="1" value="50">
  </div>

  <div class="sec">Export</div>
  <button class="primary" id="dlStl" disabled>Download STL</button>
  <button id="dlStep" disabled>Download STEP</button>
</aside>
<div id="divider" title="Drag to resize"></div>
<main>
  <canvas id="view"></canvas>
  <img id="logo" src="./assets/opulo-logo.png" alt="Opulo">
  <div id="hud"></div>
  <div id="loading">Loading geometry engine…</div>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
